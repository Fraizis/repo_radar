services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: repo_radar_clickhouse
    ports:
      - "8123:8123"  # HTTP интерфейс
      - "9000:9000"  # Native protocol
    environment:
      CLICKHOUSE_DB: repo_radar
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d
      - ./infra/clickhouse/users.d/s3queue.xml:/etc/clickhouse-server/users.d/s3queue.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse123}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:23.8-alpine
    depends_on:
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy 
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin} 
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123} 
    volumes:
      - ./infra/clickhouse/init:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for f in /sql/*.sql; do
          echo "Applying $$f"
          sed \
            -e "s|__MINIO_ROOT_USER__|$${MINIO_ROOT_USER}|g" \
            -e "s|__MINIO_ROOT_PASSWORD__|$${MINIO_ROOT_PASSWORD}|g" \
            "$$f" \
          | clickhouse-client \
            --host clickhouse \
            --user "$$CLICKHOUSE_USER" \
            --password "$$CLICKHOUSE_PASSWORD" \
            --allow_experimental_s3queue=1 \
            --multiquery
        done
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: repo_radar_minio
    ports:
      - "9002:9000"  # API
      - "9001:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: repo_radar_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repo_radar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-migrate:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - ./infra/postgres/init:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        echo "Waiting for Postgres..."
        until pg_isready -h postgres -U "$$PGUSER"; do sleep 1; done
        for f in /sql/*.sql; do
          echo "Applying $$f"
          psql \
            --host postgres \
            --username "$$PGUSER" \
            --dbname postgres \
            --file "$$f"
        done
        echo "Postgres migrate done"
    restart: "no"

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo_radar_dagster_webserver
    network_mode: host
    command: dagster-webserver -h 0.0.0.0 -p 3001 -f src/definitions.py
    environment:
      DAGSTER_HOME: /app/.dagster
      PYTHONPATH: /app/src
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: 127.0.0.1
      GHARCHIVE_START_DATE: ${GHARCHIVE_START_DATE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      MINIO_ENDPOINT: 127.0.0.1:9002
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin} 
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DAGSTER_WEBSERVER_URL: ${DAGSTER_WEBSERVER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    volumes:
      - dagster_home:/app/.dagster
      - ./src:/app/src
      - ./config:/app/config
      - ./transform:/app/transform
      - ./data:/app/data
      - ./infra/dagster/dagster.yaml:/app/.dagster/dagster.yaml:ro
      
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo_radar_dagster_daemon
    network_mode: host
    command: ["sh", "-c", "mkdir -p /app/.dagster && dagster-daemon run -f src/definitions.py"]
    environment:
      DAGSTER_HOME: /app/.dagster
      PYTHONPATH: /app/src
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DAGSTER_POSTGRES_DB: dagster
      DAGSTER_POSTGRES_HOST: 127.0.0.1
      GHARCHIVE_START_DATE: ${GHARCHIVE_START_DATE:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      MINIO_ENDPOINT: 127.0.0.1:9002
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin} 
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      DAGSTER_WEBSERVER_URL: ${DAGSTER_WEBSERVER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    volumes:
      - dagster_home:/app/.dagster
      - ./src:/app/src
      - ./config:/app/config
      - ./transform:/app/transform
      - ./data:/app/data
      - ./infra/dagster/dagster.yaml:/app/.dagster/dagster.yaml:ro

  metabase:
    image: metabase/metabase:v0.56.12 
    container_name: repo_radar_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres123}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: UTC
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  clickhouse_data:
  minio_data:
  postgres_data:
  metabase_data:
  dagster_home:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"


