services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: repo_radar_clickhouse
    ports:
      - "8123:8123"  # HTTP интерфейс
      - "9000:9000"  # Native protocol
    environment:
      CLICKHOUSE_DB: repo_radar
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD:-clickhouse123}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: repo_radar_clickhouse_migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
    volumes:
      - ./infra/clickhouse/init:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for f in /sql/*.sql; do
          echo "Applying $$f"
          clickhouse-client \
            --host clickhouse \
            --user "$$CLICKHOUSE_USER" \
            --password "$$CLICKHOUSE_PASSWORD" \
            --multiquery < "$$f"
        done
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: repo_radar_minio
    ports:
      - "9002:9000"  # API
      - "9001:9001"  # Console UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: repo_radar_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repo_radar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo_radar_dagster_webserver
    command: dagster-webserver -h 0.0.0.0 -p 3001
    ports:
      - "3001:3001"
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB:-repo_radar}
      DAGSTER_POSTGRES_HOST: postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo_radar_dagster_daemon
    command: dagster-daemon run
    environment:
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB:-repo_radar}
      DAGSTER_POSTGRES_HOST: postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse123}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./config:/app/config

  metabase:
    image: metabase/metabase:latest
    container_name: repo_radar_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${POSTGRES_DB:-repo_radar}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres123}
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data

volumes:
  clickhouse_data:
  minio_data:
  postgres_data:
  metabase_data:


