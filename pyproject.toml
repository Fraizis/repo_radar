[project]
name = "repo-radar"
version = "0.1.0"
description = "ELT-платформа для аналитики GitHub-репозиториев"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",
    "dagster-dlt>=0.23.0",
    "dagster-dbt>=0.23.0",
    "dlt[clickhouse]>=0.4.0",
    "dbt-core>=1.8.0",
    "dbt-clickhouse>=1.7.0",
    "polars[rtcompat]>=0.20.0",
    "httpx>=0.27.0",
    "playwright>=1.42.0",
    "clickhouse-connect>=0.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "minio>=7.2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "ipython>=8.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/extractors", "src/assets", "src/resources"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"



